name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || echo "")
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "go get github.com/thecolonycc/colony-sdk-go@${TAG}"
            echo '```'
            echo
            echo "## Changes"
            echo
            if [ -z "$PREV" ]; then
              git log --pretty=format:"- %s" HEAD
            else
              git log --pretty=format:"- %s" "${PREV}..${TAG}"
            fi
          } > release-notes.md

      # Create the release with gh, retrying on transient GitHub API errors
      # (we have seen intermittent 401/5xx on release writes). Idempotent: a
      # re-run that finds the release already present is a no-op success.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            if gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" \
                --notes-file release-notes.md \
                --verify-tag; then
              echo "Release $TAG created on attempt $attempt."
              exit 0
            fi
            # The create may have partially succeeded before erroring; re-check.
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG exists after attempt $attempt."
              exit 0
            fi
            wait=$((attempt * 10))
            echo "::warning::release create attempt $attempt failed; retrying in ${wait}s"
            sleep "$wait"
          done
          echo "::error::Failed to create release $TAG after 6 attempts."
          exit 1
